<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take a Test — AI SKILL SCAN Career Assessment</title>
    <meta name="description" content="Take the AI SKILL SCAN Career Assessment Test. Log in or register to begin your AI-powered psychometric career assessment.">
    <meta name="keywords" content="take career test, career assessment login, AI skill scan test, psychometric test login">
    <link rel="stylesheet" href="styles/styles.css">
    <style>
        /* ---- Permission Overlay ---- */
        .permission-overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(17, 17, 17, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            font-family: var(--font-family);
        }
        .permission-overlay.hidden { display: none; }

        .permission-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
            padding: 48px 40px;
            max-width: 460px;
            width: 90%;
            text-align: center;
        }
        .permission-card__icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            color: var(--color-primary);
        }
        .permission-card__title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--color-dark);
            margin-bottom: 12px;
        }
        .permission-card__text {
            font-size: 0.95rem;
            color: #555;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .permission-card__btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 32px;
            background: var(--color-primary);
            color: #fff;
            font-family: var(--font-family);
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(230, 57, 70, 0.35);
            transition: all 0.3s ease;
        }
        .permission-card__btn:hover {
            background: var(--color-primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(230, 57, 70, 0.45);
        }
        .permission-card__btn svg {
            width: 20px;
            height: 20px;
        }
        .permission-card__error {
            display: none;
            margin-top: 20px;
            padding: 14px 18px;
            background: #fff3f3;
            border: 1px solid #ffcdd2;
            border-radius: 10px;
            color: #c62828;
            font-size: 0.88rem;
            line-height: 1.5;
        }
        .permission-card__error.visible { display: block; }

        /* ---- Iframe Section (hidden until permission granted) ---- */
        .iframe-section {
            padding: 0;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
        }
        .iframe-section.hidden { display: none; }

        .iframe-container {
            flex: 1;
            width: 100%;
            min-height: 600px;
        }
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            min-height: 600px;
            border: none;
        }

        /* ---- Back Button (hidden until permission granted) ---- */
        .back-btn {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 1000;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 20px;
            background: var(--color-primary);
            color: #fff;
            font-family: var(--font-family);
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .back-btn.hidden { display: none; }
        .back-btn:hover {
            background: var(--color-primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        .back-btn svg {
            width: 18px;
            height: 18px;
        }
        @media (max-width: 768px) {
            .iframe-container,
            .iframe-container iframe {
                min-height: 500px;
            }
            .permission-card {
                padding: 36px 24px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== CAMERA PERMISSION OVERLAY ===== -->
    <div id="permissionOverlay" class="permission-overlay">
        <div class="permission-card">
            <!-- Camera icon -->
            <svg class="permission-card__icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="m15.75 10.5 4.72-4.72a.75.75 0 0 1 1.28.53v11.38a.75.75 0 0 1-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 0 0 2.25-2.25v-9a2.25 2.25 0 0 0-2.25-2.25h-9A2.25 2.25 0 0 0 2.25 7.5v9a2.25 2.25 0 0 0 2.25 2.25Z"/>
            </svg>
            <h2 class="permission-card__title">Camera Access Required</h2>
            <p class="permission-card__text">This assessment requires camera access for proctoring. Please allow camera access to continue.</p>
            <button id="allowCameraBtn" class="permission-card__btn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="m15.75 10.5 4.72-4.72a.75.75 0 0 1 1.28.53v11.38a.75.75 0 0 1-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 0 0 2.25-2.25v-9a2.25 2.25 0 0 0-2.25-2.25h-9A2.25 2.25 0 0 0 2.25 7.5v9a2.25 2.25 0 0 0 2.25 2.25Z"/></svg>
                Allow Camera &amp; Continue
            </button>
            <div id="permissionError" class="permission-card__error">
                Camera access was denied. Please enable camera permissions in your browser settings and try again.
            </div>
        </div>
    </div>

    <!-- Floating Back Button (hidden until permission granted) -->
    <a href="javascript:history.back()" id="backBtn" class="back-btn hidden">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18"/></svg>
        Back
    </a>

    <main>
        <!-- Iframe section (hidden until permission granted) -->
        <section id="iframeSection" class="iframe-section hidden">
            <div class="iframe-container">
                <iframe id="assessmentIframe" data-src="https://ekajalaka.eccetra.com/en/login" src="" title="AI SKILL SCAN Career Assessment Login" allowfullscreen></iframe>
            </div>
        </section>
    </main>

    <!-- ===== FOOTER (shared via footer.js) ===== -->
    <div id="footer-placeholder"></div>
    <script src="scripts/footer.js"></script>

    <script src="scripts/script.js"></script>

    <!-- Camera Permission Logic -->
    <script>
    (function () {
        const overlay     = document.getElementById('permissionOverlay');
        const allowBtn    = document.getElementById('allowCameraBtn');
        const errorBox    = document.getElementById('permissionError');
        const iframeSection = document.getElementById('iframeSection');
        const iframe      = document.getElementById('assessmentIframe');
        const backBtn     = document.getElementById('backBtn');

        function requestCamera() {
            // Reset error state
            errorBox.classList.remove('visible');
            allowBtn.textContent = 'Requesting…';
            allowBtn.disabled = true;

            navigator.mediaDevices.getUserMedia({ video: {} })
                .then(function (stream) {
                    // Permission granted — stop the camera immediately (we only need permission)
                    stream.getTracks().forEach(function (track) { track.stop(); });

                    // Hide overlay, show iframe and back button
                    overlay.classList.add('hidden');
                    iframeSection.classList.remove('hidden');
                    backBtn.classList.remove('hidden');

                    // Load the assessment page into the iframe
                    iframe.src = iframe.getAttribute('data-src');
                })
                .catch(function () {
                    // Permission denied or error
                    errorBox.classList.add('visible');
                    allowBtn.innerHTML =
                        '<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="m15.75 10.5 4.72-4.72a.75.75 0 0 1 1.28.53v11.38a.75.75 0 0 1-1.28.53l-4.72-4.72M4.5 18.75h9a2.25 2.25 0 0 0 2.25-2.25v-9a2.25 2.25 0 0 0-2.25-2.25h-9A2.25 2.25 0 0 0 2.25 7.5v9a2.25 2.25 0 0 0 2.25 2.25Z"/></svg> ' +
                        'Try Again';
                    allowBtn.disabled = false;
                });
        }

        allowBtn.addEventListener('click', requestCamera);
    })();
    </script>
</body>
</html>
